# Copy to .github/workflows/screenshot-studio.yml in your app repository and adjust `project`.
# The action builds the Screenshot Studio CLI from its own source at the pinned ref (a few minutes
# per run) until the npm package is published.
name: Screenshots

on:
  pull_request:
    paths:
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin a full commit SHA; the same ref selects the CLI source the action builds.
      - uses: VitaliiDeveloper/Screenshot-Studio@<commit-sha>
        with:
          project: screenshots/app-store-screenshots.json
          # layout: default
          # profile: fastlane
          # fail-on-warning: true
          # out: screenshots-export
          # artifact-name: screenshots
