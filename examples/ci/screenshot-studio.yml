# Copy to .github/workflows/screenshot-studio.yml in your app repository and adjust `project`.
name: Screenshots

on:
  pull_request:
    paths:
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # The action runs `npm install`, so dependency code must not find the job's git token.
        with:
          persist-credentials: false
      # Pin a full commit SHA; the CLI version in that commit is the one the action installs from npm.
      - uses: VitaliiDeveloper/Screenshot-Studio@<commit-sha>
        with:
          project: screenshots/app-store-screenshots.json
          # layout: default
          # profile: fastlane
          # fail-on-warning: true
          # out: screenshots-export
          # artifact-name: screenshots-${{ github.job }}
