name: Screenshot Studio
description: Check a Screenshot Studio project, export its store screenshots, and upload them as a workflow artifact.

inputs:
  project:
    description: Path to app-store-screenshots.json or the folder that contains it, relative to the workspace.
    required: true
  layout:
    description: Layout id or name to check and export. Empty uses the layout the CLI exports by default.
    required: false
    default: ""
  profile:
    description: Export folder layout, `default` or `fastlane` (fastlane deliver and supply folders).
    required: false
    default: default
  fail-on-warning:
    description: Also fail on check warnings, not only blockers (`screenshots check --strict`).
    required: false
    default: "false"
  out:
    description: Export folder, relative to the workspace.
    required: false
    default: screenshots-export
  artifact-name:
    description: Name of the uploaded workflow artifact. Set it per entry when a matrix or one job runs the action more than once.
    required: false
    default: screenshots-${{ github.job }}

outputs:
  out:
    description: Absolute path of the export folder.
    value: ${{ steps.resolve.outputs.out }}
  check-log:
    description: File holding the `screenshots check` output, written even when the check fails.
    value: ${{ steps.resolve.outputs.check-log }}
  cache-hit:
    description: "`true` when the Playwright Chromium came from the cache, `false` when it was downloaded."
    value: ${{ steps.browsers.outputs.cache-hit == 'true' }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
        package-manager-cache: false

    - id: resolve
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_OUT: ${{ inputs.out }}
        CLI_SOURCE: ${{ github.action_path }}
      run: |
        fail() { echo "::error::$1"; exit 1; }
        [ "$RUNNER_OS" = Linux ] || fail "Screenshot Studio's action supports Linux runners only."
        case "$INPUT_PROFILE" in default | fastlane) ;; *) fail "profile must be default or fastlane, got: $INPUT_PROFILE" ;; esac
        case "$INPUT_FAIL_ON_WARNING" in true | false) ;; *) fail "fail-on-warning must be true or false, got: $INPUT_FAIL_ON_WARNING" ;; esac
        project="$INPUT_PROJECT"
        if [ -d "$project" ]; then project="$project/app-store-screenshots.json"; fi
        [ -f "$project" ] || fail "Project file not found: $project"
        cli="$(realpath "$CLI_SOURCE")"
        pnpm_version="$(node -p 'require(process.argv[1]).packageManager.split("@")[1].split("+")[0]' "$cli/package.json")"
        {
          echo "project=$(realpath "$project")"
          echo "out=$(realpath -m "$INPUT_OUT")"
          echo "cli=$cli"
          echo "pnpm-version=$pnpm_version"
          echo "pnpm-prefix=$RUNNER_TEMP/screenshot-studio-pnpm"
          echo "browsers-path=${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          echo "check-log=$RUNNER_TEMP/screenshot-studio-check.log"
        } >> "$GITHUB_OUTPUT"

    # shortcut: builds the CLI from source on every run; replace with an npm install of the CLI once it is published.
    # pnpm goes into a private prefix so the consumer's later steps keep their own pnpm.
    - id: build
      shell: bash
      working-directory: ${{ steps.resolve.outputs.cli }}
      env:
        PNPM_VERSION: ${{ steps.resolve.outputs.pnpm-version }}
        PNPM_PREFIX: ${{ steps.resolve.outputs.pnpm-prefix }}
        NEXT_TELEMETRY_DISABLED: "1"
      run: |
        npm install --global --prefix "$PNPM_PREFIX" "pnpm@$PNPM_VERSION"
        export PATH="$PNPM_PREFIX/bin:$PATH"
        pnpm install --frozen-lockfile
        pnpm build:cli-package
        echo "playwright-version=$(cd packages/cli && node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

    - id: browsers
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.resolve.outputs.browsers-path }}
        key: screenshot-studio-${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.build.outputs.playwright-version }}

    # Runs on a hit too: it skips builds already present and adds any the restored cache lacks.
    - shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.cli }}
      run: node "$CLI/packages/cli/package/dist/index.js" setup

    # Saved before the check so a project that keeps failing still reuses the browser download.
    - if: steps.browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.resolve.outputs.browsers-path }}
        key: ${{ steps.browsers.outputs.cache-primary-key }}

    # Same system packages and fonts as the repository's E2E job (`playwright install --with-deps`).
    # Apt sources from packages.microsoft.com are set aside during the install and put back afterwards.
    - shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.cli }}
        CACHE_HIT: ${{ steps.browsers.outputs.cache-hit == 'true' }}
      run: |
        echo "Playwright Chromium cache hit: $CACHE_HIT"
        sudo=()
        if [ "$(id -u)" != 0 ]; then
          command -v sudo > /dev/null || { echo "::error::Installing Playwright's system packages needs root or sudo."; exit 1; }
          sudo=(sudo)
        fi
        parked="$RUNNER_TEMP/screenshot-studio-apt-sources"
        mkdir -p "$parked"
        trap '"${sudo[@]}" find "$parked" -mindepth 1 -maxdepth 1 -exec mv -t /etc/apt/sources.list.d/ {} +' EXIT
        { "${sudo[@]}" grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ || true; } | "${sudo[@]}" xargs -0 -r mv -t "$parked"
        node "$CLI/packages/cli/node_modules/playwright/cli.js" install-deps chromium

    - shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.cli }}
        PROJECT: ${{ steps.resolve.outputs.project }}
        LAYOUT: ${{ inputs.layout }}
        STRICT: ${{ inputs.fail-on-warning }}
        CHECK_LOG: ${{ steps.resolve.outputs.check-log }}
      run: |
        args=(check --render --project "$PROJECT")
        if [ -n "$LAYOUT" ]; then args+=(--layout "$LAYOUT"); fi
        if [ "$STRICT" = true ]; then args+=(--strict); fi
        if ! node "$CLI/packages/cli/package/dist/index.js" "${args[@]}" 2>&1 | tee "$CHECK_LOG"; then
          echo "::error::screenshots check failed; see the output above."
          exit 1
        fi

    - shell: bash
      env:
        CLI: ${{ steps.resolve.outputs.cli }}
        PROJECT: ${{ steps.resolve.outputs.project }}
        LAYOUT: ${{ inputs.layout }}
        PROFILE: ${{ inputs.profile }}
        OUT: ${{ steps.resolve.outputs.out }}
      run: |
        args=(export --project "$PROJECT" --out "$OUT")
        if [ -n "$LAYOUT" ]; then args+=(--layout "$LAYOUT"); fi
        if [ "$PROFILE" = fastlane ]; then args+=(--profile fastlane); fi
        node "$CLI/packages/cli/package/dist/index.js" "${args[@]}"

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.resolve.outputs.out }}
        if-no-files-found: error
