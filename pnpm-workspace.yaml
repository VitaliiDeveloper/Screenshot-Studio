packages:
  - "packages/*"
  - "apps/*"
# pnpm 10.26+/11 blocks package build scripts by default (ERR_PNPM_IGNORED_BUILDS). The headless
# renderer the e2e/parity suite drives needs these two native builds, so allow them explicitly.
# (This replaces the old package.json `pnpm.onlyBuiltDependencies`, which pnpm 11 no longer reads.)
allowBuilds:
  esbuild: true
  sharp: true
# Dev-only: stop `next dev` from broadcasting the new-connection HMR sync to every client, which
# full-reloads open editor tabs whenever an export's /render pages connect after a rebuild.
# Re-check upstream and regenerate (`pnpm patch next@<version>`) when bumping Next.
patchedDependencies:
  next@16.4.1: patches/next@16.4.1.patch
