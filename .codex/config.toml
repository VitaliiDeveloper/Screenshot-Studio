# Lean defaults for this repository. Expensive capabilities can still be enabled
# explicitly for a task when their evidence is required.
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
model_auto_compact_token_limit = 128000
model_auto_compact_token_limit_scope = "total"
tool_output_token_limit = 4000
project_doc_max_bytes = 12000
personality = "none"
service_tier = "default"
web_search = "cached"

[features]
apps = false
auth_elicitation = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
fast_mode = false
goals = false
hooks = false
image_generation = false
in_app_browser = false
memories = false
multi_agent = false
personality = false
plugin_sharing = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false
tool_call_mcp_elicitation = false
tool_suggest = false
workspace_dependencies = false

[memories]
generate_memories = false
use_memories = false

[mcp_servers.context7]
enabled = false

[mcp_servers.node_repl]
enabled = false

[mcp_servers.computer-use]
enabled = false

[plugins."build-ios-apps@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = false

