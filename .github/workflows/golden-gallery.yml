name: Golden gallery

on:
  workflow_dispatch:
  # golden-gallery-dev.yml calls this for pull requests into dev that touch the gallery.
  workflow_call:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  golden-gallery:
    # Pixel references are an integration-boundary gate, like the full browser suite.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || (github.base_ref == 'main' && github.head_ref == 'dev')))
    runs-on: ubuntu-latest
    # A full run takes about 4 minutes locally; the margin covers a slower runner, not a hang.
    timeout-minutes: 30
    concurrency:
      group: golden-gallery-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ | sudo xargs -0 -r rm -f
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm golden:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-gallery-renders-${{ github.sha }}
          path: test-results/golden-gallery/
          if-no-files-found: ignore
          retention-days: 14
