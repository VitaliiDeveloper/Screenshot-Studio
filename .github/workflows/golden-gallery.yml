name: Golden gallery

on:
  workflow_dispatch:
  # golden-gallery-dev.yml calls this for pull requests into dev that touch the gallery.
  workflow_call:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  golden-gallery:
    # Pixel references are an integration-boundary gate, like the full browser suite.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.base_ref == 'dev' || (github.base_ref == 'main' && github.head_ref == 'dev')))
    runs-on: ubuntu-latest
    # A full run takes about 4 minutes locally; the margin covers a slower runner, not a hang.
    timeout-minutes: 30
    concurrency:
      group: golden-gallery-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo grep -rlZ 'packages.microsoft.com' /etc/apt/sources.list.d/ | sudo xargs -0 -r rm -f
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm golden:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-gallery-renders-${{ github.sha }}
          path: test-results/golden-gallery/
          if-no-files-found: ignore
          retention-days: 14
