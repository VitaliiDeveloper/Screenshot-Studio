name: Release candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/release-candidate.yml"
      - "docs/releasing.md"
      - "scripts/build-cli-package.mjs"
      - "scripts/check-community.mjs"
      - "scripts/check-release-candidate.mjs"
      - "scripts/check-spdx.mjs"
      - "scripts/check-spdx.test.ts"
      - "scripts/release-audit.mjs"
      - "scripts/release-audit.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/web/package.json"
      - "packages/core/package.json"
      - "packages/cli/package.json"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:community
      - run: pnpm check:spdx
      - run: pnpm check:release-candidate
