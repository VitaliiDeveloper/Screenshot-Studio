version: 2
updates:
  # The root directory covers .github/workflows and the composite action.yml.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # A limit of 0 keeps version-update PRs off; Dependabot still opens security-update PRs.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
