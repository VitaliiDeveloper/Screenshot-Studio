name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities go through the [private advisory form](https://github.com/VitaliiDeveloper/Screenshot-Studio/security/advisories/new), not here.
  - type: input
    id: cli-version
    attributes:
      label: CLI version
      description: Output of `screenshots --version`. Version 0.1.0 predates that flag; use `npm ls --global @screenshot-studio/cli` instead.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.13.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `screenshots ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error output or a screenshot of the editor.
    validations:
      required: true
  - type: textarea
    id: project-snippet
    attributes:
      label: Project snippet
      description: Optional. The smallest part of `app-store-screenshots.json` that reproduces the problem. Do not paste secrets, store credentials, or private asset paths.
      render: json
    validations:
      required: false
